services:
  rivet-roulette:
    image: nginx:1.27-alpine
    container_name: rivet-roulette
    restart: unless-stopped
    ports:
      - "127.0.0.1:18088:80"
      - "192.168.50.5:18088:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
