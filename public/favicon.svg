<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <!-- Circular brushed metal plate -->
  <circle cx="90" cy="90" r="85" fill="#cfd8dc" stroke="#90a4ae" stroke-width="6"/>
  <!-- Highlight and Shadow for 3D look -->
  <circle cx="90" cy="90" r="82" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <circle cx="90" cy="90" r="85" fill="none" stroke="#37474f" stroke-width="2" opacity="0.4"/>
  <!-- Rivets around the border -->
  <circle cx="90" cy="20" r="6" fill="#37474f"/>
  <circle cx="160" cy="90" r="6" fill="#37474f"/>
  <circle cx="90" cy="160" r="6" fill="#37474f"/>
  <circle cx="20" cy="90" r="6" fill="#37474f"/>
  <circle cx="40" cy="40" r="6" fill="#37474f"/>
  <circle cx="140" cy="40" r="6" fill="#37474f"/>
  <circle cx="140" cy="140" r="6" fill="#37474f"/>
  <circle cx="40" cy="140" r="6" fill="#37474f"/>
  <!-- Center symbol: "RR" (Rivet Roulette) in bold mid-century typewriter style -->
  <text x="90" y="105" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#263238" text-anchor="middle">RR</text>
</svg>
